# 釘住的版本不會自己更新：這個設定讓 Dependabot 每週檢查新版並開 PR，由人看過變更再合併。
# 涵蓋 GitHub Actions（釘在 commit SHA，PR 會同時更新 SHA 與後面註解的版本號）、npm、pip、Docker 基底映像（稽核 SUP-5）。
#
# 注意事項：
# - pip：Dependabot 更新的是 requirements*.txt 裡「直接」套件的版本。合併前要在 PR 分支上跑
#   scripts/compile_requirements.sh（只升特定套件用 UPGRADE_PACKAGES="套件名"）重編 *.lock，
#   否則實際安裝的（帶雜湊的）鎖定檔不會變。
#   torch／torchaudio 排除在外：實際安裝的是 PyTorch CPU index 的 +cpu 版（requirements-torch.lock），Dependabot
#   會提議 PyPI 上的另一種版本，合併後也不會同步鎖定檔。這兩個要人工查新版，改 requirements.txt 後跑
#   scripts/compile_requirements.sh torch，並確認 Docker 映像建得起來。
# - Docker：只看得到 backend/Dockerfile 的 FROM（Python 基底映像，標籤加摘要一起更新）。
#   deploy.sh 的 node 映像與 CI 的 nginx 映像寫在 shell／workflow 裡，Dependabot 看不到，要手動跟著維護。
#
# 依風險分級（2026-11 整合 Dependabot PR 後的經驗）：
# - 小版本與修補版：同一生態系合併成一個 PR（GitHub Actions、pip、npm 開發工具各一個），一次看完、一次跑 CI。
# - 大版本：不分組，每個各自一個 PR——大版本可能有不相容的改動（例如 checkout 7、setup-node 7、eslint 10、vitest 5），
#   要逐個讀 release notes 並確認專案用到的參數有沒有受影響。
# - TipTap：8 個 @tiptap/* 套件用 peerDependencies 互相鎖定同一版，單獨升級任何一個都會 ERESOLVE，
#   所以不論大小版本一律合成同一個 PR。
# - Docker 的 Python 基底映像：只接受修補版（3.12.x）。Python 的 3.12 → 3.15 在版本語意上算 minor，
#   所以要同時擋 minor 與 major。換 Python 版本是專案層級的決定：requirements*.lock（scripts/compile_requirements.sh 寫死 3.12）、
#   CI 的 python-version、本機開發環境都要一起換，而且要確認所有套件有對應版本的預編譯檔
#   （2026-11 評估 3.15：pyyaml 6.0.3 與 torchaudio 2.11.0 都還沒有 3.15 的版本）。要升時手動改 Dockerfile，再移除這條 ignore。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      # 小版本與修補版合併成一個 PR；大版本各自一個 PR（要先讀 release notes）
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /my-react-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 開發工具（lint、測試）的小版本與修補版合併成一個 PR，減少雜訊；執行期套件仍各自一個 PR
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      # 8 個 @tiptap/* 必須同版本一起升（見檔頭說明），所以含大版本也合成一個 PR
      tiptap:
        patterns: ["@tiptap/*"]

  - package-ecosystem: pip
    directory: /my-react-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 小版本與修補版合併成一個 PR（合併前只需重編一次 lock）；大版本各自一個 PR
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchaudio"

  - package-ecosystem: docker
    directory: /my-react-app/backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # 只接受 3.12.x 的修補版；換 Python 版本是專案層級的決定（見檔頭說明）
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
