name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 預設權限收到最小：這些工作只需要讀取程式碼。沒有宣告時，token 會拿到儲存庫預設的（通常是讀寫）權限，
# 第三方 action 被入侵時就能拿來改程式碼、發版本。
permissions:
  contents: read

# 第三方 action 一律釘到完整的 commit SHA（後面註解寫對應的版本）：只用 @v4 這種標籤的話，
# 標籤可以被改指到別的 commit，等於讓上游任意更換我們執行的程式碼。
# 更新方式：.github/dependabot.yml 每週會自動開 PR 更新 SHA 與版本註解。

# 儲存庫根目錄是 my-react-app 的上一層（GitHub 只讀儲存庫根目錄的 .github/），
# 專案本身在 my-react-app/ 子資料夾，所以每個工作的指令都從那裡執行。
# 快取檔路徑一律明寫：儲存庫根目錄另有一個空的 package-lock.json，不寫的話快取會去雜湊那個空檔。

jobs:
  frontend:
    name: Frontend (lint / build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-react-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-react-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  firestore-rules:
    name: Firestore rules (emulator behavior tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-react-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-react-app/package-lock.json

      # Firestore emulator 需要 Java 執行環境。
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      # 原本 CI 完全沒有涵蓋 firestore.rules，規則被不小心改壞（例如 sharedNotes
      # 的作者身份檢查被拿掉）語法上仍然合法，只有實際跑一次讀寫才抓得到。
      # emulators:exec 會自動啟動模擬器、跑完測試後關掉，不需要額外手動起停。
      - run: npx firebase emulators:exec --config firebase.rules-test.json --only firestore,storage,database --project yuanyu-app-rules-test "npm run test:rules"

  deploy-scripts:
    name: Deploy scripts (behavior tests / compose config)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-react-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # deploy.sh 與 deploy/backup.sh 是正式環境唯一的部署與備份入口，改壞了只有部署當下
      # 才會發現。test_deploy.sh 用假的 docker／git／curl／pg_dump 跑過成功、自動回滾、
      # .env 防呆、備份失敗中止、代理檢查等每條路徑，不需要真的 docker。
      - run: bash -n deploy.sh && bash -n deploy/backup.sh && bash -n deploy/env.sh
      - run: bash deploy/test_deploy.sh

      # compose 檔語法與變數替換是否正確。env_file 需要檔案存在，給空檔即可。
      - run: touch .env serviceAccountKey.json && docker compose -f docker-compose.prod.yml config -q

  backend:
    name: Backend (Django + FastAPI tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-react-app
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      AUTH_DEV_BYPASS: "True"
      ANTHROPIC_API_KEY: ci-dummy-token
      AUDIO_FILE_URL: https://example.invalid/audio/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            my-react-app/requirements-dev.lock
            my-react-app/requirements-torch.lock

      # torch/torchaudio 需要從 PyTorch 的 CPU wheel index 安裝（見 requirements.txt 開頭註解）。CI 不需要 GPU，裝 CPU 版。
      # 稽核 SUP-1：用帶雜湊的 requirements-torch.lock、只指向 PyTorch index（不加 PyPI 當第二個索引）；
      # --no-deps 因為它們的相依在 requirements-dev.lock（從 PyPI、同樣帶雜湊），下一步一起裝。
      - name: Install PyTorch (CPU, hash-verified)
        run: pip install --require-hashes --no-deps --index-url https://download.pytorch.org/whl/cpu -r requirements-torch.lock

      # --require-hashes：鎖定檔裡每個檔案的 SHA-256 都要對得上，套件庫上被偷換的檔案裝不進來。
      # 鎖定檔由 scripts/compile_requirements.sh 產生（改了 requirements*.txt 要重新產生）。
      - name: Install remaining Python dependencies (hash-verified)
        run: pip install --require-hashes -r requirements-dev.lock && pip check

      - name: Django tests (CrosswordPuzzle / crawler / AIModel)
        working-directory: my-react-app/backend
        run: python manage.py test

      - name: FastAPI tests
        working-directory: my-react-app/backend
        run: pytest fastAPI/tests -v

  docker-image:
    name: Docker image (hash-verified install / pip check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-react-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 稽核 SUP-1：Dockerfile 不准再出現第二個套件索引（--extra-index-url）：兩個索引並存時，
      # 同名套件會從版本較高的那邊安裝，就是相依混淆的入口。
      - name: Dockerfile has no extra package index
        run: "! grep -n -e '--extra-index-url' backend/Dockerfile | grep -v '^[0-9]*:[[:space:]]*#'"

      # 正式環境用的映像：三份鎖定檔都必須能用 --require-hashes 裝起來，
      # 而且 Dockerfile 最後的 pip check 要通過。開發機沒有 Docker，這是唯一會真的建一次映像的地方。
      - run: docker build -f backend/Dockerfile -t yuanyu-backend:ci .

      - name: pip check inside the image
        run: docker run --rm yuanyu-backend:ci pip check

      # 容器不該用 root 跑（資安 S-16）。
      - name: Container runs as non-root
        run: test "$(docker run --rm yuanyu-backend:ci id -u)" != "0"

  nginx-config:
    name: nginx config (nginx -t)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-react-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # deploy/nginx.conf 放進 conf.d（http 層）使用，並引用憑證與 snippets。
      # 這裡用臨時的自簽憑證與官方 nginx 映像只驗證語法與指令是否被接受；
      # 版本與正式伺服器的 nginx 可能不同，部署前仍要在伺服器上跑一次 nginx -t。
      - name: Generate throwaway certificate
        run: |
          mkdir -p "$RUNNER_TEMP/le/live/example.com"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=example.com" \
            -keyout "$RUNNER_TEMP/le/live/example.com/privkey.pem" \
            -out "$RUNNER_TEMP/le/live/example.com/fullchain.pem"

      - name: nginx -t
        run: |
          docker run --rm \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/nginx-security-headers.conf:/etc/nginx/snippets/yuanyu-security-headers.conf:ro" \
            -v "$RUNNER_TEMP/le:/etc/letsencrypt:ro" \
            nginx:1.28@sha256:146adea4768b83c607d0bdfa4188464e3da6e0a3ad4475db1d1d8f64f27c29cc nginx -t

  dependency-audit:
    name: Dependency vulnerability scan (pip-audit / npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-react-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-react-app/package-lock.json

      # 稽核 SUP-7：鎖定檔把版本釘死，之後才公開的漏洞不會自己出現，要定期對漏洞資料庫比對。
      # 這一步會擋下合併：新增或沿用有已知漏洞的版本時，要先升版（UPGRADE_PACKAGES="套件" scripts/compile_requirements.sh）。
      # requirements-torch.lock 的 +cpu 版本不在 PyPI，pip-audit 查不到：另外把版本號去掉 +cpu 後單獨掃一次
      # （PyTorch 的 CPU 版與 PyPI 版漏洞公告對應同一個版本號）。
      - name: pip-audit (hash-pinned lock files)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.lock -r requirements-dev.lock --require-hashes --disable-pip
          grep -E '^(torch|torchaudio)==' requirements-torch.lock | sed -E 's/\+cpu.*//' > "$RUNNER_TEMP/torch-versions.txt"
          test "$(wc -l < "$RUNNER_TEMP/torch-versions.txt")" = "2"
          pip-audit -r "$RUNNER_TEMP/torch-versions.txt" --no-deps --disable-pip

      # 已知且判定可暫時接受的 npm 公告：firebase 底下 @firebase/firestore 巢狀的 @grpc/grpc-js@1.9.16，
      # 只有 @firebase/firestore 的 Node 入口才會載入，瀏覽器打包不含；npm 建議的修法是降級 firebase，不可行。
      # 不是整個步驟都放行：只放行這兩個公告編號（GHSA），以及因它們而被連帶標記的四個套件名稱；
      # 出現任何其他公告編號（即使是同一個套件）或其他套件就失敗。處理掉之後（firebase 換掉巢狀版本）把集合清空。
      - name: npm audit (production dependencies)
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const packages = new Set(["@grpc/grpc-js", "@firebase/firestore", "@firebase/firestore-compat", "firebase"]);
            const advisories = new Set(["GHSA-m9gg-hp2v-232j", "GHSA-f596-whhp-79r4"]);
            const report = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (report.error) { console.error("npm audit 失敗：", report.error); process.exit(1); }
            const unexpected = [];
            for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
              if (!packages.has(name)) { unexpected.push(name + "（套件不在允許清單）"); continue; }
              for (const via of v.via || []) {
                if (typeof via === "string") { if (!packages.has(via)) unexpected.push(name + " <- " + via); continue; }
                const id = (String(via.url || "").match(/GHSA-[a-z0-9-]+/i) || [""])[0];
                if (!advisories.has(id)) unexpected.push(name + " 的公告 " + (id || JSON.stringify(via).slice(0, 80)));
              }
            }
            for (const u of unexpected) console.error("未預期的公告：", u);
            console.log("npm audit 回報", Object.keys(report.vulnerabilities || {}).length, "個套件，其中未預期", unexpected.length, "項");
            process.exit(unexpected.length ? 1 : 0);
          ' "$RUNNER_TEMP/npm-audit.json"
