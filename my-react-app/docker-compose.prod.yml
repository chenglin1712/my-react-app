services:
  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [.env]
    network_mode: host
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --workers 3 --bind 127.0.0.1:8000"
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
      - ./logs:/app/logs
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [.env]
    network_mode: host
    command: sh -c "cd fastAPI && alembic upgrade head && cd .. && uvicorn fastAPI.main:app --host 127.0.0.1 --port 8001"
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
      - ./logs:/app/logs
    restart: unless-stopped
