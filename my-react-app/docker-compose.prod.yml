# 正式環境（單機、network_mode: host）。部署流程見 deploy.sh（含健康檢查與回滾）。
#
# image 名稱固定：deploy.sh 在重建前把目前的 image 標成 :prev，新版本沒通過健康檢查
# 時用它切回上一版。沒有固定名稱的話，compose 每次重建都會讓舊 image 變成沒有標籤
# 的懸空 image，隨即被 `docker image prune` 清掉，沒有東西可以回滾。
#
# 容器不用 root 執行：user 取自 APP_UID／APP_GID（deploy.sh 設成執行部署的使用者），
# 讓掛進來的 ./logs、./media 與唯讀的 serviceAccountKey.json 都用同一個擁有者。
# 直接用 docker compose 而不是 deploy.sh 時，要自己設：APP_UID=$(id -u) APP_GID=$(id -g) docker compose ...
#
# 容器加固（稽核 DEP-1）：network_mode: host 讓容器直接站在主機網路上，所以程式碼一旦被執行，能做的事要盡量少。
# - cap_drop: [ALL]：不需要任何 Linux capability（兩個服務都綁 1024 以上的埠、以非 root 執行）。
# - no-new-privileges：行程不能靠 setuid 之類的方式取得更多權限。
# - read_only：根檔案系統唯讀；真正會寫入的位置用 tmpfs（記憶體，重啟清空）或掛進來的目錄（./logs、./media）。
#   tmpfs 用 mode=1777，因為容器的 uid 由 APP_UID 決定（不固定）。
#   若新版本多了需要寫入的路徑，會在健康檢查時失敗並自動回滾；補上對應的 tmpfs 即可。
services:
  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: yuanyu-django:latest
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    env_file: [.env]
    environment:
      # DATABASE_URL 漏設時啟動失敗，不要靜默退回容器內的 SQLite（見 core/settings.py）
      REQUIRE_DATABASE_URL: "true"
      # 後台上傳的首頁媒體（宣傳影片、封面、字幕）。必須掛持久化磁碟，否則容器重建檔案就消失
      MEDIA_ROOT: /app/media
    network_mode: host
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
      # collectstatic 的輸出（啟動時重新產生，WhiteNoise 從這裡提供靜態檔）
      - /app/backend/staticfiles:mode=1777,size=128m
      # 應用程式 log 預設寫在 backend/logs（沒設 LOG_DIR 時），與原本一樣隨容器重建清空；console 輸出另由 docker 保存
      - /app/backend/logs:mode=1777,size=128m
    # --timeout 必須大於 LLM 最長等待（config/llm.py：約 55 秒），否則 gunicorn 會在 LLM
    # 逾時處理執行前就強制殺掉 worker；同時要小於 nginx 的 proxy_read_timeout（90 秒）。
    #
    # gthread：AI 助手的串流回覆（AIModel.views.tayal_chat_stream）一次占用一條連線數十秒。
    # 原本 3 個 sync worker 只能同時處理 3 個請求，三個人同時在串流，其他所有請求（含 /health/）都得排隊；
    # 改成每個 worker 4 條執行緒（共 12 條）。gthread 的 --timeout 是「worker 主執行緒多久沒回報」，
    # 不是單一請求的時間，所以長串流不會被誤殺；串流端點自己有 55 秒的整體期限。
    # 每條執行緒各自連資料庫，連線數上限是 workers × threads = 12，要小於 PostgreSQL 的 max_connections。
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --workers 3 --worker-class gthread --threads 4 --timeout 75 --graceful-timeout 15 --bind 127.0.0.1:8000"
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
      - ./logs:/app/logs
      # nginx 從 <repo>/media/homepage/ 直接送檔（deploy/nginx.conf），Django 寫入同一個目錄
      - ./media:/app/media
    # /health/ 會實際探測資料庫與 cache（見 backend/core/views.py）。X-Forwarded-Proto
    # 讓 SECURE_SSL_REDIRECT 不要把這個本機 HTTP 探測轉成 301。回 503 時 urlopen 會丟
    # 例外、指令以非 0 結束。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}), timeout=4)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: yuanyu-fastapi:latest
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    env_file: [.env]
    environment:
      REQUIRE_DATABASE_URL: "true"
      # 啟動時就載入發音比對模型，並讓 /ready 把它納入就緒條件（見 fastAPI/main.py）
      PRELOAD_PRONUNCIATION_MODEL: "true"
    network_mode: host
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      # 使用者上傳的錄音會在這裡暫存解碼
      - /tmp:mode=1777,size=512m
      - /app/backend/logs:mode=1777,size=128m
    command: sh -c "cd fastAPI && alembic upgrade head && cd .. && uvicorn fastAPI.main:app --host 127.0.0.1 --port 8001 --no-server-header --proxy-headers --forwarded-allow-ips=127.0.0.1"
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
      - ./logs:/app/logs
    # 用 /ready 而不是 /health：快取與模型預熱完成前回 503，部署腳本等到「真的準備好」
    # 才算成功。預熱需要全表掃描與載入模型，start_period 給得寬鬆。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/ready', timeout=4)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 180s
    restart: unless-stopped
