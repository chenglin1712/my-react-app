<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/languages.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#221812" />
  <title>源·語</title>
  <meta name="description" content="源·語：以影像辨識、單詞查詢、翻譯、遊戲與適性測驗學習泰雅、阿美、布農、噶瑪蘭、排灣五族語言的學習平台。" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="源·語" />
  <meta property="og:locale" content="zh_TW" />
  <meta property="og:title" content="源·語｜五族語言學習平台" />
  <meta property="og:description" content="影像辨識、單詞查詢、翻譯、詞彙遊戲與適性測驗，用鮮明色彩延續族語文化的生命力。" />
  <meta name="twitter:card" content="summary" />
  <!-- YUAN・YU v2 設計系統字體：用 <link> 而非 CSS @import，讓瀏覽器一解析到
       <head> 就能立刻並行抓取，不用等 theme-v2.css 載完才「發現」還要再抓字體。
       見 static/css/default/theme-v2.css 開頭註解。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 字型 CSS 改成不擋住畫面：一般的 <link rel="stylesheet"> 會阻擋首次繪製，慢速網路下
       連上面的載入殼都要等到字型 CSS 下載完才看得到（實測約 3 秒）。用 media="print" 先載入、
       載完再切成 all，載入殼與頁面骨架可以立刻顯示（字型到了再換上，display=swap 本來就是這個行為）。 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet"></noscript>
  <!-- 開頁載入殼：JS 還沒下載完之前整頁是空白（慢速網路實測約 3.5 秒全白）。
       這段 CSS 與標記全部內嵌，不等任何外部檔案；React 的 createRoot().render()
       會直接取代 #root 的內容，所以不需要另外移除。 -->
  <style>
    html, body { margin: 0; background: #F3E7CF; }
    .boot-shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #F3E7CF; color: #221812; font-family: 'Silkscreen', ui-monospace, monospace; }
    .boot-shell__mark { display: grid; grid-template-columns: repeat(3, 14px); gap: 4px; }
    .boot-shell__mark i { width: 14px; height: 14px; background: #9E1B24; animation: boot-blink 1.2s steps(2, end) infinite; }
    .boot-shell__mark i:nth-child(2n) { background: #1F3A5C; animation-delay: .2s; }
    .boot-shell__mark i:nth-child(5) { background: #D9A227; animation-delay: .4s; }
    .boot-shell__name { font-size: 18px; letter-spacing: .24em; }
    .boot-shell__bar { width: 180px; height: 10px; border: 3px solid #221812; background: #fff; overflow: hidden; box-shadow: 3px 3px 0 #221812; }
    .boot-shell__bar b { display: block; width: 40%; height: 100%; background: #9E1B24; animation: boot-slide 1.1s steps(8, end) infinite; }
    @keyframes boot-blink { 50% { opacity: .25; } }
    @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .boot-shell__mark i, .boot-shell__bar b { animation: none; } }
  </style>
</head>

<body>
  <div id="root">
    <div class="boot-shell" role="status" aria-live="polite">
      <div class="boot-shell__mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="boot-shell__name" aria-hidden="true">YUAN・YU</div>
      <div class="boot-shell__bar" aria-hidden="true"><b></b></div>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">載入中…</span>
    </div>
  </div>
  <noscript>此網站需要啟用 JavaScript 才能使用。</noscript>
  <script type="module" src="frontend/src/main.jsx"></script>
</body>

</html>
