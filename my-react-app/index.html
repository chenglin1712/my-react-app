<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <!-- 防閃白：在任何樣式表之前，同步讀取儲存的主題偏好並設定 <html data-theme>（見 DESIGN.md「深淺色政策」）。
       規則與 frontend/src/theme/themeStore.js 相同：只認 light | dark | system，其他或讀取失敗一律淺色；
       公開深色切換的功能旗標（VITE_ENABLE_DARK_THEME）沒開時一律淺色。
       腳本在 public/theme-init.js（外部小檔，CSP 的 script-src 不必開 unsafe-inline；稽核 FE-2），
       旗標用 data-dark-enabled 帶進去。這裡不可再放內嵌 <script> 或 onload 之類的事件屬性
       （themeMenuLook.test.js 會檢查）。 -->
  <script src="/theme-init.js" data-dark-enabled="%VITE_ENABLE_DARK_THEME%"></script>
  <link rel="icon" type="image/svg+xml" href="/languages.svg" />
  <!-- PWA：可安裝到主畫面。manifest 與圖示在 public/，service worker 見 public/sw.js -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFF9ED" />
  <meta name="color-scheme" content="light" />
  <title>源·語</title>
  <meta name="description" content="源·語：以影像辨識、單詞查詢、翻譯、遊戲與適性測驗學習泰雅、阿美、布農、噶瑪蘭、排灣五族語言的學習平台。" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="源·語" />
  <meta property="og:locale" content="zh_TW" />
  <meta property="og:title" content="源·語｜五族語言學習平台" />
  <meta property="og:description" content="影像辨識、單詞查詢、翻譯、詞彙遊戲與適性測驗，用鮮明色彩延續族語文化的生命力。" />
  <meta name="twitter:card" content="summary" />
  <!-- YUAN・YU v2 設計系統字體：用 <link> 而非 CSS @import，讓瀏覽器一解析到
       <head> 就能立刻並行抓取，不用等 theme-v2.css 載完才「發現」還要再抓字體。
       見 static/css/default/theme-v2.css 開頭註解。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 字型 CSS 改成不擋住畫面：一般的 <link rel="stylesheet"> 會阻擋首次繪製，慢速網路下
       連上面的載入殼都要等到字型 CSS 下載完才看得到（實測約 3 秒）。用 media="print" 先載入、
       載完再切成 all，載入殼與頁面骨架可以立刻顯示（字型到了再換上，display=swap 本來就是這個行為）。 -->
  <!-- 字型（沉穩文藝加 Apple 質感）：標題、導覽與內文全部 Noto Sans TC，只有品牌字標保留宋體（見下一個 <link>）。
       另外載入不帶 TC 的 Noto Sans，是為了族語字母：兩個 TC 字型都沒有 ʼ ŋ ɨ ʉ ʔ ʾ 等字形
       （fontTools 讀完整字型檔實測，51 個候選字元只有 11 個在 TC 字型裡），沒有這層會落到使用者系統字型。
       Google 依 unicode-range 切片，只有頁面用到的字元才會下載對應切片。
       用可變字型區間（400..900）而不是逐一列出字重：CSS 從約 748KB 降到約 257KB，
       也讓專案用到的 650、850 字重真的畫得出來。證據與已知缺口見 static/css/fontStack.test.js。 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400..900&family=Noto+Sans:wght@400..900&display=swap" rel="stylesheet" media="print" data-async-font>
  <!-- 品牌字標專用的宋體子集：只含「原語」與「YUAN・YU」這幾個字（text 參數，實測約 3.3 KB）。
       全站標題已改無襯線（2026-11-06 批准，Apple 化步驟 1-4），Noto Serif TC 與 Noto Serif 不再整段載入。
       字標若新增字，要同步改 text 參數；static/css/fontStack.test.js 會檢查字標用字都在子集內。text 參數作用於整個請求，所以要獨立一個 <link>。 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&text=%E5%8E%9F%E8%AA%9EYUAN%E3%83%BBYU&display=swap" rel="stylesheet" media="print" data-async-font>
  <script src="/font-async.js" defer></script>
  <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400..900&family=Noto+Sans:wght@400..900&display=swap" rel="stylesheet"></noscript>
  <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&text=%E5%8E%9F%E8%AA%9EYUAN%E3%83%BBYU&display=swap" rel="stylesheet"></noscript>
  <!-- 開頁載入殼：JS 還沒下載完之前整頁是空白（慢速網路實測約 3.5 秒全白）。
       這段 CSS 與標記全部內嵌，不等任何外部檔案；React 的 createRoot().render()
       會直接取代 #root 的內容，所以不需要另外移除。 -->
  <style>
    /* 載入殼：象牙白底、單一字標淡入縮放、底部一條細進度線（Apple 化步驟 2-1）。
       只用系統字型：網路字型這時還沒到，放進堆疊只會在字型到達時多一次換字。
       深色比照 theme-init.js 設的 data-theme：dark 或 system 且系統為深色。 */
    :root { --boot-bg: #FFF9ED; --boot-ink: #221812; --boot-line: #98694C; }
    :root[data-theme="dark"] { --boot-bg: #24282C; --boot-ink: #F2EEE3; --boot-line: #C99372; }
    @media (prefers-color-scheme: dark) { :root[data-theme="system"] { --boot-bg: #24282C; --boot-ink: #F2EEE3; --boot-line: #C99372; } }
    html, body { margin: 0; background: var(--boot-bg); }
    .boot-shell { position: relative; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: var(--boot-bg); color: var(--boot-ink); font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    .boot-shell__name { font-size: 28px; letter-spacing: .32em; padding-left: .32em; font-family: 'Songti TC', 'PMingLiU', serif; font-weight: 900; animation: boot-in 600ms cubic-bezier(0.23, 1, 0.32, 1) both; }
    .boot-shell__bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; }
    .boot-shell__bar b { display: block; width: 35%; height: 100%; background: var(--boot-line); animation: boot-slide 1.4s cubic-bezier(0.45, 0, 0.25, 1) infinite; }
    @keyframes boot-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) { .boot-shell__name { animation: none; } .boot-shell__bar b { animation: none; width: 100%; opacity: .35; } }
  </style>
</head>

<body>
  <div id="root">
    <div class="boot-shell" role="status" aria-live="polite">
      <div class="boot-shell__name" aria-hidden="true">原語</div>
      <div class="boot-shell__bar" aria-hidden="true"><b></b></div>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">載入中…</span>
    </div>
  </div>
  <noscript>此網站需要啟用 JavaScript 才能使用。</noscript>
  <script type="module" src="frontend/src/main.jsx"></script>
</body>

</html>
