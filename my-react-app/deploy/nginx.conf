# 反向代理參考設定（nginx）。
#
# 這份設定的路徑對照來自 repo 內的事實，不是憑空假設：
#   - 前端打的後端路徑：.env.example 的 VITE_API_* 與 vite.config.js 的 proxy 清單
#   - Django（127.0.0.1:8000）：backend/core/urls.py 的 health/、crawler/、AIModel/、
#     CrosswordPuzzle/、adminapi/，以及 WhiteNoise 提供的 static/
#   - FastAPI（127.0.0.1:8001）：backend/fastAPI/main.py 的 /api/v1/ 底下所有路由
#   - 兩個後端都只綁 127.0.0.1（docker-compose.prod.yml），一定要靠這一層對外
#
# 這是「範本」：伺服器上實際的設定（網域、憑證路徑、dist 所在目錄）要改成你的值。
# 我沒有辦法從 repo 得知你現有伺服器的設定，也沒有在真實 nginx 上驗證過這份檔案，
# 部署前請先用 `nginx -t` 檢查語法，再用 deploy.sh 結尾的路由檢查確認轉發正確。

# HTTP 一律導向 HTTPS（Django 開了 SECURE_SSL_REDIRECT，後端只接受 HTTPS 語意）
server {
    listen 80;
    server_name example.com;           # TODO: 改成你的網域
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;           # TODO: 改成你的網域

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;   # TODO
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;     # TODO

    # 發音錄音與影像辨識會上傳檔案；後端自己的上限是 10 MB（PRONUNCIATION_MAX_AUDIO_MB），
    # 這裡略放寬到 12 MB，讓超限的請求由後端回有意義的錯誤，而不是被 nginx 直接 413。
    client_max_body_size 12m;

    # 前端靜態檔：deploy.sh 會把 `npm run build` 的結果放在 repo 根目錄的 dist/
    root /srv/yuanyu/dist;             # TODO: 改成 repo 實際所在位置 + /dist
    index index.html;

    # 共用的代理標頭。X-Forwarded-Proto 很重要：Django 靠它判斷請求是不是 HTTPS
    # （settings.py 的 SECURE_PROXY_SSL_HEADER），少了它會陷入無限重新導向。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # AI 對話／翻譯會等待 LLM 回應。逾時預算由內而外逐層放大：
    #   LLM 最長約 55 秒（單次 25 秒、重試 1 次，見 backend/config/llm.py）
    #   < gunicorn --timeout 75 秒（docker-compose.prod.yml）
    #   < 這裡的 proxy_read_timeout 90 秒
    # 只調大 nginx 沒有用：gunicorn 會先殺掉 worker。
    proxy_connect_timeout 5s;
    proxy_read_timeout    90s;

    # ── FastAPI ──
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8001;
    }

    # 服務對服務的內部端點（Django 通知 FastAPI 清快取），只准本機呼叫，不對外開放
    location /internal/ {
        deny all;
    }

    # ── 首頁宣傳影片媒體（S3-4，HOMEPAGE_CONTRACT.md 第 7 節）──
    # 只對外提供 /media/homepage/；上傳暫存目錄（media/_staging）與其他子目錄都不在這個 location 內。
    # 檔名由後端用 uuid 產生，替換檔案就是新檔名，所以可以長期快取。
    # add_header 不加 always：只有 2xx、3xx 會帶 immutable，404 絕不能被快取一年。
    # disable_symlinks on：即使目錄裡被放進符號連結，nginx 也不會跟隨。
    # 影片請求支援 Range（nginx 靜態檔預設支援）。
    location /media/homepage/ {
        root /srv/yuanyu;              # TODO: 與 repo 位置一致，檔案實際在 <repo>/media/homepage/
        disable_symlinks on;
        try_files $uri =404;
        types {
            video/mp4   mp4;
            image/jpeg  jpg jpeg;
            image/webp  webp;
            text/vtt    vtt;
        }
        default_type application/octet-stream;
        # 注意：location 內只要有 add_header，就不會再繼承父層（server 層）的 add_header。
        # 日後若在 server 層加 HSTS 或 CSP，要把它們一起放進這個 location。
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /media/ 底下除了上面那個 location 以外一律不提供（含 _staging）
    location /media/ {
        return 404;
    }

    # 影片上傳端點：請求本體上限放寬到 160m（影片 150MB 加 multipart 開銷），只對這個路徑生效。
    # nginx 預設會先把整個請求暫存到磁碟再轉給後端，這能保護 gunicorn worker，但上傳期間會暫用
    # 約一倍的磁碟空間（暫存路徑見 client_body_temp_path，預設在 /var/lib/nginx 或 /var/cache/nginx）。
    # ^~ 讓這個前綴 location 優先於下面的正規表示式 location。
    location ^~ /adminapi/promo-videos/ {
        client_max_body_size 160m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
    }

    # ── Django ──
    location ~ ^/(AIModel|crawler|CrosswordPuzzle|adminapi|health|static)/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # 帶雜湊檔名的前端資源可以長期快取
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA：其餘路徑交給前端路由（react-router），不存在的檔案回 index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
