# 反向代理參考設定（nginx）。
#
# 這份設定的路徑對照來自 repo 內的事實，不是憑空假設：
#   - 前端打的後端路徑：.env.example 的 VITE_API_* 與 vite.config.js 的 proxy 清單
#   - Django（127.0.0.1:8000）：backend/core/urls.py 的 health/、crawler/、AIModel/、
#     CrosswordPuzzle/、adminapi/，以及 WhiteNoise 提供的 static/
#   - FastAPI（127.0.0.1:8001）：backend/fastAPI/main.py 的 /api/v1/ 底下所有路由
#   - 兩個後端都只綁 127.0.0.1（docker-compose.prod.yml），一定要靠這一層對外
#
# 這是「範本」：伺服器上實際的設定（網域、憑證路徑、dist 所在目錄）要改成你的值。
# 我沒有辦法從 repo 得知你現有伺服器的設定，也沒有在真實 nginx 上驗證過這份檔案，
# 部署前請先用 `nginx -t` 檢查語法，再用 deploy.sh 結尾的路由檢查確認轉發正確。

# ── 資訊揭露 ───────────────────────────────────────────────
# 不在錯誤頁與 Server 標頭透露 nginx 版本。放在 http 層（這個檔案在 conf.d 時就是 http 層），
# 連下面 80 埠的導向、以及日後新增的任何 server 區塊都一起生效；只放在 443 的 server 裡，80 埠仍會洩漏版本。
# 後端（gunicorn／uvicorn）自己的 Server 標頭不會外洩：nginx 預設不轉發上游的 Server、Date 標頭。
server_tokens off;

# ── 速率限制（S-09）────────────────────────────────────────
# 這一層只擋「單一來源 IP 瞬間灌大量請求」的洪水，不取代後端依使用者的限流（那是真正的使用政策）。
# 數字刻意寬鬆：學校、公司的一整個班級可能共用同一個對外 IP，擋太嚴會誤傷正常使用。
# 上線後看 error.log 的 "limiting requests" 訊息，再依實際流量調整。
# limit_req_zone／limit_conn_zone 只能放在 http 層；這個檔案放在 conf.d（會被 include 進 http）時，這裡就是 http 層。
limit_req_zone  $binary_remote_addr zone=yy_api:10m   rate=30r/s;   # 一般 API
limit_req_zone  $binary_remote_addr zone=yy_heavy:10m rate=15r/s;   # 會呼叫 LLM、影像辨識、翻譯的昂貴端點（依 IP；真正的每人門檻由後端依使用者計算）
limit_conn_zone $binary_remote_addr zone=yy_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# HTTP 一律導向 HTTPS（Django 開了 SECURE_SSL_REDIRECT，後端只接受 HTTPS 語意）
server {
    listen 80;
    server_name example.com;           # TODO: 改成你的網域
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;           # TODO: 改成你的網域

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;   # TODO
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;     # TODO

    # ── TLS ──
    # 只留 TLS 1.2／1.3：1.0／1.1 已被 IETF 淘汰（RFC 8996），主流瀏覽器也早已停用。
    # 加密套件取 Mozilla「intermediate」建議中前向保密的 ECDHE 搭配 AEAD 的部分（略過 DHE 與舊套件；TLS 1.3 的套件由 nginx 自己決定，
    # 不受這一行影響）。ssl_prefer_server_ciphers 在 TLS 1.2 的現代套件之間不需要由伺服器挑，維持 off。
    # 這份清單與設定的出處與更新：https://ssl-config.mozilla.org/（選 nginx、intermediate），OpenSSL 版本不同時請對照。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # session 重用省掉重複握手；關掉 session ticket：ticket 的加密金鑰長期放在記憶體，會削弱前向保密，
    # 而且多台伺服器要同步金鑰才有用。
    ssl_session_cache   shared:yy_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # 沒有開 OCSP stapling：Let's Encrypt 已在 2025 年停止提供 OCSP，新簽的憑證沒有 OCSP 網址，
    # 開了 nginx 只會每次載入都警告 "no OCSP responder URL"。改用其他 CA 且憑證有 OCSP 網址時，再加
    # ssl_stapling on; ssl_stapling_verify on; 與 resolver。

    # 慢速連線（slowloris）：標頭與本體要在合理時間內送完，不然放掉這條連線。
    # 影片上傳那個 location 另外放寬了 client_body_timeout。
    client_header_timeout 15s;
    client_body_timeout   30s;

    include /etc/nginx/snippets/yuanyu-security-headers.conf;   # 安全標頭（見 deploy/nginx-security-headers.conf）

    # 發音錄音與影像辨識會上傳檔案；後端自己的上限是 10 MB（PRONUNCIATION_MAX_AUDIO_MB），
    # 這裡略放寬到 12 MB，讓超限的請求由後端回有意義的錯誤，而不是被 nginx 直接 413。
    client_max_body_size 12m;

    # 隱藏檔（.git、.env、.DS_Store 等）一律不提供，即使不小心放進靜態檔目錄也不會被讀到。
    # 例外 .well-known：憑證驗證（ACME）與 security.txt 需要。
    # 注意：含 "/." 的任何路徑都會落在這裡（regex 優先於 /api/v1/ 這類一般前綴），後端 API 的路徑參數不要以點開頭。
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    # 前端靜態檔：deploy.sh 會把 `npm run build` 的結果放在 repo 根目錄的 dist/
    root /srv/yuanyu/dist;             # TODO: 改成 repo 實際所在位置 + /dist
    index index.html;

    # 共用的代理標頭。X-Forwarded-Proto 很重要：Django 靠它判斷請求是不是 HTTPS
    # （settings.py 的 SECURE_PROXY_SSL_HEADER），少了它會陷入無限重新導向。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # 直接覆寫成 nginx 看到的連線 IP，丟掉客戶端自己帶來的 X-Forwarded-For。
    # 原本用 $proxy_add_x_forwarded_for 會保留客戶端送來的值再附加在後面；後端雖然只信任最右邊那一段，
    # 但沒有理由讓偽造的值一路傳到應用程式。（日後前面再加 CDN／負載平衡器時，改用 nginx 的 real_ip 模組
    # 只信任它們的網段，不要退回 $proxy_add_x_forwarded_for。）
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # AI 對話／翻譯會等待 LLM 回應。逾時預算由內而外逐層放大：
    #   LLM 最長約 55 秒（單次 25 秒、重試 1 次，見 backend/config/llm.py）
    #   < gunicorn --timeout 75 秒（docker-compose.prod.yml）
    #   < 這裡的 proxy_read_timeout 90 秒
    # 只調大 nginx 沒有用：gunicorn 會先殺掉 worker。
    proxy_connect_timeout 5s;
    proxy_read_timeout    90s;

    # ── FastAPI ──
    location /api/v1/ {
        limit_req zone=yy_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    # 會呼叫付費 LLM／影像辨識的 FastAPI 端點用比較嚴的門檻（前綴 location 比 /api/v1/ 更長，優先）
    location ^~ /api/v1/translation/ {
        limit_req zone=yy_heavy burst=60 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }
    location ^~ /api/v1/vision/ {
        limit_req zone=yy_heavy burst=60 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    # 服務對服務的內部端點（Django 通知 FastAPI 清快取），只准本機呼叫，不對外開放
    location /internal/ {
        deny all;
    }

    # ── 首頁宣傳影片媒體（S3-4，HOMEPAGE_CONTRACT.md 第 7 節）──
    # 只對外提供 /media/homepage/；上傳暫存目錄（media/_staging）與其他子目錄都不在這個 location 內。
    # 檔名由後端用 uuid 產生，替換檔案就是新檔名，所以可以長期快取。
    # add_header 不加 always：只有 2xx、3xx 會帶 immutable，404 絕不能被快取一年。
    # disable_symlinks on：即使目錄裡被放進符號連結，nginx 也不會跟隨。
    # 影片請求支援 Range（nginx 靜態檔預設支援）。
    location /media/homepage/ {
        root /srv/yuanyu;              # TODO: 與 repo 位置一致，檔案實際在 <repo>/media/homepage/
        disable_symlinks on;
        try_files $uri =404;
        types {
            video/mp4   mp4;
            image/jpeg  jpg jpeg;
            image/webp  webp;
            text/vtt    vtt;
        }
        default_type application/octet-stream;
        # 注意：location 內只要有 add_header，就不會再繼承父層（server 層）的 add_header，
        # 所以下面 include 了安全標頭（內含 X-Content-Type-Options: nosniff）。
        include /etc/nginx/snippets/yuanyu-security-headers.conf;   # 安全標頭（見 deploy/nginx-security-headers.conf）
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /media/ 底下除了上面那個 location 以外一律不提供（含 _staging）
    location /media/ {
        return 404;
    }

    # 影片上傳端點：請求本體上限放寬到 160m（影片 150MB 加 multipart 開銷），只對這個路徑生效。
    # nginx 預設會先把整個請求暫存到磁碟再轉給後端，這能保護 gunicorn worker，但上傳期間會暫用
    # 約一倍的磁碟空間（暫存路徑見 client_body_temp_path，預設在 /var/lib/nginx 或 /var/cache/nginx）。
    # ^~ 讓這個前綴 location 優先於下面的正規表示式 location。
    location ^~ /adminapi/promo-videos/ {
        client_max_body_size 160m;
        client_body_timeout 120s;
        limit_req zone=yy_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # AI 助手的串流回覆（Server-Sent Events，AIModel.views.tayal_chat_stream）。
    # nginx 預設會先把後端的回應攢起來再送，串流就失去意義（文字會等到整段結束才一起出現），所以這條路徑關掉緩衝。
    # 後端也送了 X-Accel-Buffering: no，這裡明確寫出來是不依賴單一機制。
    # 逾時：後端 55 秒內一定收尾（STREAM_DEADLINE_SECONDS），低於 gunicorn --timeout 75 秒與這裡的 90 秒。
    # 要放在下面「Django」的正規表示式 location 之前，^~ 讓這個前綴優先。
    location ^~ /AIModel/tayal_chat/stream/ {
        limit_req zone=yy_heavy burst=60 nodelay;
        # 同一個來源 IP 同時最多 100 條串流（SSE 會長時間佔住連線）。只限這裡：放在 server 層會把靜態檔與
        # 一般 API 的並行請求（HTTP/2 每個 stream 都算一條）也算進去，一個班級共用 IP 時容易誤傷。
        limit_conn yy_conn 100;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # location 裡只要有 proxy_set_header，就不會繼承 server 層的 proxy_set_header：
        # 沒有下面這四行，Django 收不到真實來源 IP 與 X-Forwarded-Proto（限流會把所有人當成同一個 127.0.0.1，
        # 並且可能因為判斷成 HTTP 而重新導向）。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # ── Django ──
    # AI 助手（LLM）用比較嚴的門檻；前綴 location 要放在正規表示式 location 之前才會優先（^~）
    location ^~ /AIModel/ {
        limit_req zone=yy_heavy burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/(crawler|CrosswordPuzzle|adminapi|health|static)/ {
        limit_req zone=yy_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # 帶雜湊檔名的前端資源可以長期快取
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/yuanyu-security-headers.conf;   # 安全標頭（見 deploy/nginx-security-headers.conf）
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA：其餘路徑交給前端路由（react-router），不存在的檔案回 index.html
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/yuanyu-security-headers.conf;   # 安全標頭（見 deploy/nginx-security-headers.conf）
        add_header Cache-Control "no-cache";
    }
}
