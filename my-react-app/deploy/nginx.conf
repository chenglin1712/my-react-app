# 反向代理參考設定（nginx）。
#
# 這份設定的路徑對照來自 repo 內的事實，不是憑空假設：
#   - 前端打的後端路徑：.env.example 的 VITE_API_* 與 vite.config.js 的 proxy 清單
#   - Django（127.0.0.1:8000）：backend/core/urls.py 的 health/、crawler/、AIModel/、
#     CrosswordPuzzle/、adminapi/，以及 WhiteNoise 提供的 static/
#   - FastAPI（127.0.0.1:8001）：backend/fastAPI/main.py 的 /api/v1/ 底下所有路由
#   - 兩個後端都只綁 127.0.0.1（docker-compose.prod.yml），一定要靠這一層對外
#
# 這是「範本」：伺服器上實際的設定（網域、憑證路徑、dist 所在目錄）要改成你的值。
# 我沒有辦法從 repo 得知你現有伺服器的設定，也沒有在真實 nginx 上驗證過這份檔案，
# 部署前請先用 `nginx -t` 檢查語法，再用 deploy.sh 結尾的路由檢查確認轉發正確。

# HTTP 一律導向 HTTPS（Django 開了 SECURE_SSL_REDIRECT，後端只接受 HTTPS 語意）
server {
    listen 80;
    server_name example.com;           # TODO: 改成你的網域
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;           # TODO: 改成你的網域

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;   # TODO
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;     # TODO

    # 發音錄音與影像辨識會上傳檔案；後端自己的上限是 10 MB（PRONUNCIATION_MAX_AUDIO_MB），
    # 這裡略放寬到 12 MB，讓超限的請求由後端回有意義的錯誤，而不是被 nginx 直接 413。
    client_max_body_size 12m;

    # 前端靜態檔：deploy.sh 會把 `npm run build` 的結果放在 repo 根目錄的 dist/
    root /srv/yuanyu/dist;             # TODO: 改成 repo 實際所在位置 + /dist
    index index.html;

    # 共用的代理標頭。X-Forwarded-Proto 很重要：Django 靠它判斷請求是不是 HTTPS
    # （settings.py 的 SECURE_PROXY_SSL_HEADER），少了它會陷入無限重新導向。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # AI 對話／翻譯會等待 LLM 回應（單次逾時 30 秒、最多重試 2 次，見 config/llm.py），
    # 讀取逾時要大於這個總和。
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;

    # ── FastAPI ──
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8001;
    }

    # 服務對服務的內部端點（Django 通知 FastAPI 清快取），只准本機呼叫，不對外開放
    location /internal/ {
        deny all;
    }

    # ── Django ──
    location ~ ^/(AIModel|crawler|CrosswordPuzzle|adminapi|health|static)/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # 帶雜湊檔名的前端資源可以長期快取
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA：其餘路徑交給前端路由（react-router），不存在的檔案回 index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
