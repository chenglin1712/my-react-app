# 瀏覽器安全標頭（S-08）。nginx 的 add_header 有一個陷阱：location 裡只要有自己的 add_header，
# 就不會再繼承 server 層的 add_header。所以這份檔案被 nginx.conf 引用在 server 層，以及每一個
# 自己有 add_header 的 location（目前是 /media/homepage/、/assets/、/）。新增這類 location 時記得也 include。
#
# 安裝：複製到 nginx 的 snippets 目錄再 include（路徑相對於 nginx 的 prefix，通常是 /etc/nginx）：
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx-security-headers.conf /etc/nginx/snippets/yuanyu-security-headers.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# always：連 4xx、5xx 的回應也帶（沒有 always 時 nginx 只在 2xx、3xx 加）。

# HTTPS 一年內強制。刻意不加 includeSubDomains／preload：同網域底下若有只支援 HTTP 的子網域會被鎖死，
# 而且 preload 幾乎無法反悔。確認所有子網域都是 HTTPS 之後，再自行決定要不要加。
add_header Strict-Transport-Security "max-age=31536000" always;

# 瀏覽器不要自己猜內容型態（檔案上傳、使用者內容被當成腳本執行的常見入口）
add_header X-Content-Type-Options "nosniff" always;

# 不允許被別的網站用 iframe 嵌入（防點擊劫持）。CSP 的 frame-ancestors 是新版寫法，這個是舊瀏覽器用的。
add_header X-Frame-Options "SAMEORIGIN" always;

# 跨站連結只帶來源網域，不帶完整網址（網址裡可能有答題代號、搜尋字詞）
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 這個站會用到相機（影像辨識）與麥克風（發音練習），只開給自己；其他裝置能力一律關閉。
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;

# 內容安全政策——分兩層：
#
# 1) 強制執行（不依賴頁面內容，不會誤傷）：不准被嵌入、不准改 <base>、不准 <object>/<embed>、表單只送回自己。
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

# 2) 先「只回報不阻擋」（Report-Only）：來源清單是依程式碼實際用到的外部網站整理的
#    （Google Fonts、Cloudinary 圖片與上傳、YouTube 內嵌、Firebase 的 googleapis／firebaseio），但沒有在真實瀏覽器逐頁驗證過。
#    上線後打開瀏覽器開發者工具的 Console，把常用頁面（登入、翻譯、測驗、AI 助手、筆記、後台）走一遍，
#    看有沒有 "[Report Only] Refused to ..." 的訊息，補上漏掉的來源之後，再把標頭名稱改成 Content-Security-Policy 正式執行。
#
#    部署前依實際的 Firebase 設定收斂來源：VITE_FIREBASE_DATABASE_URL 若是區域型網址（*.firebasedatabase.app，
#    已列入），以及 VITE_FIREBASE_AUTH_DOMAIN 若是自訂網域，要把那個網域加進 frame-src 與 connect-src。
#
#    目前 script-src 沒有 'unsafe-inline'，但 index.html 有一段內嵌的防閃白腳本（讀主題偏好），
#    字型 <link> 也有內嵌的 onload。所以正式執行前必須先處理這兩處：把防閃白腳本改成外部小檔（或用雜湊），
#    onload 改成腳本綁定。否則直接強制執行會讓頁面一開始就出現錯誤。style-src 保留 'unsafe-inline'
#    是因為 index.html 的載入殼與 React 的 style 屬性都用到內嵌樣式。
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com https://i.ytimg.com https://*.googleusercontent.com; media-src 'self' blob: data: https://res.cloudinary.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://api.cloudinary.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://*.firebaseapp.com; worker-src 'self' blob:; manifest-src 'self'" always;
