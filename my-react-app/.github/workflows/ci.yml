name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint / build / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  firestore-rules:
    name: Firestore rules (emulator behavior tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Firestore emulator 需要 Java 執行環境。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      # 原本 CI 完全沒有涵蓋 firestore.rules，規則被不小心改壞（例如 sharedNotes
      # 的作者身份檢查被拿掉）語法上仍然合法，只有實際跑一次讀寫才抓得到。
      # emulators:exec 會自動啟動模擬器、跑完測試後關掉，不需要額外手動起停。
      - run: npx firebase emulators:exec --config firebase.rules-test.json --only firestore,storage --project yuanyu-app-rules-test "npm run test:rules"

  deploy-scripts:
    name: Deploy scripts (behavior tests / compose config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # deploy.sh 與 deploy/backup.sh 是正式環境唯一的部署與備份入口，改壞了只有部署當下
      # 才會發現。test_deploy.sh 用假的 docker／git／curl／pg_dump 跑過成功、自動回滾、
      # .env 防呆、備份失敗中止、代理檢查等每條路徑，不需要真的 docker。
      - run: bash -n deploy.sh && bash -n deploy/backup.sh
      - run: bash deploy/test_deploy.sh

      # compose 檔語法與變數替換是否正確。env_file 需要檔案存在，給空檔即可。
      - run: touch .env serviceAccountKey.json && docker compose -f docker-compose.prod.yml config -q

  backend:
    name: Backend (Django + FastAPI tests)
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      AUTH_DEV_BYPASS: "True"
      ANTHROPIC_API_KEY: ci-dummy-token
      AUDIO_FILE_URL: https://example.invalid/audio/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # torch/torchaudio/torchvision 需要從 PyTorch 的 CPU wheel index 安裝，
      # 直接 pip install -r requirements.txt 會嘗試抓預設 index、可能抓到不對的
      # build 或抓不到（見 requirements.txt 開頭註解）。CI 不需要 GPU，先裝 CPU 版。
      - name: Install PyTorch (CPU)
        run: pip install torch==2.10.0 torchaudio==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining Python dependencies
        run: pip install -r requirements.txt

      - name: Django tests (CrosswordPuzzle / crawler / AIModel)
        working-directory: backend
        run: python manage.py test

      - name: FastAPI tests
        working-directory: backend
        run: pytest fastAPI/tests -v
